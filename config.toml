# Site configuration. This file is about the website; facts about a mod live in
# content/<project>/mod.toml. Zola reads this file; so does CI.

# Where the site lives. On GitHub Pages the workflow substitutes the real Pages URL, so this
# value matters for local previews and for links inside the offline documentation that ships
# in archives. Include the repository path for project sites: https://OWNER.github.io/REPO
base_url = "https://dreamweave-mp.github.io/vfs"
title = "DreamWeave VFS"
description = "A virtual filesystem over the host's, with archive and overlay providers, as a Jess library."

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
# REQUIRED. The GitHub repository that builds and publishes this site. Release downloads are
# served from its GitHub Releases, and CI refuses to build if these do not name the repository
# it is running in.
github_username = "DreamWeave-MP"
github_project = "vfs"

# Shown in the header. Defaults to `title`.
logo_text = "DreamWeave VFS"

# Palette: purple (DreamWeave), teal, gold, ember, moss, umber, grove, prism, slate, crimson,
# indigo, azure or frost. `accent` overrides the palette's accent with any #rrggbb color. Anything
# bigger belongs in sass/brand.sass.
palette = "purple"
# accent = "#b48cff"

# Header links. `url` may be a Zola @/ path or an absolute URL.
menu_items = [
    { name = "DreamWeave VFS", url = "@/home/index.md" },
    { name = "Network", url = "@/network.md" },
]

# Optional footer text. Plain text; the year is not added for you.
# footer_text = "Made by the Ashlands Lighting Collective"

# favicon = "img/favicon.png"

# Swap every heading (or only project titles) to one of the bundled fonts:
# avqest, gal-basic, mystic-cards, deja-vu-sans-mono, demonic-letters, oxanium.
# font_override = "oxanium"
# font_override_titles_only = true

# Page-view counts from https://www.goatcounter.com with your own site code. Off until you set it;
# a site built from this template never reports to DreamWeave's analytics.
# goatcounter = "your-code"

# Comments: GitHub Discussions on this site's own repository (github_username/github_project),
# embedded with giscus and loaded live in the reader's browser. They appear once the repository has
# Discussions enabled and https://github.com/apps/giscus installed; until then the build says so and
# leaves them out. There are no ids to paste: the build looks them up for your repository.
[extra.comments]
enabled = false
category = "General"
# reactions = true        # emoji reactions on the thread's first post
# theme = "dark_dimmed"   # any giscus theme; default is DreamWeave's, in your palette
