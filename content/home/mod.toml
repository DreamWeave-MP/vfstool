# vfstool, the program. Structured facts only: the name and summary are `title` and `description`
# in index.md. The library it is built on, vfstool_lib, is its own project in content/lib/. Every
# key is explained at https://dreamweave-mp.github.io/DreamWeave-Mod-Template/guide/mod-toml/

# Permanent identity. Never changes, whatever the program is called or wherever it is hosted.
id = "34fc442a-5060-4b77-8c64-ca5ea9861a10"

# The slug names the project on this site. Release tags are bare versions, like Cargo's: 1.0.0.
slug = "vfstool"
type = "tool"
status = "active"
license = "MIT OR Apache-2.0"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[links]
donate = "https://ko-fi.com/magicaldave"

# A Jess package: `jess` names the Package Source this project publishes, the workspace member
# `vfstool/`. Each release tag `vfstool-<version>` is one version of the package, packed by the Mod
# Template from that tag; every push to main packs a development build. Versions 1.0.1 and below are
# the Rust program, which lives on the `rust` branch with its GitHub releases.
#
# `application` releases it as a program too, from 2.0.1: CI packs the workspace into `vfstool.jsw`,
# which `jess install org.dreamweave.vfstool` installs, and a jess carrying it for each platform
# below, which runs without jess installed. The site's workflow names it with jess_application.
[package]
format = "jpk"
jess = "org.dreamweave.vfstool"
application = "vfstool"

[[platforms]]
os = "windows"
arch = "x86_64"

[[platforms]]
os = "macos"
arch = "x86_64"

[[platforms]]
os = "macos"
arch = "aarch64"

[[platforms]]
os = "linux"
arch = "x86_64"

[install]
notes = """
`jess install org.dreamweave.vfstool` puts `vfstool` on your PATH. Without jess, unzip the
download for your platform and run the `vfstool` inside. In a workspace that names it under
`[dev-dependencies]`, `jess workspace run --trusted vfstool -- find-file -s textures/tx_wood_01.dds`
runs it there. Either way, name the `openmw.cfg` to read, or the folder holding it, with
`--config` or `OPENMW_CONFIG`: vfstool doesn't look for OpenMW's default location yet.
"""

[[media]]
file = "media/vfstool.webp"
alt = "vfstool's icon: two crossed wrenches on the DreamWeave disc."
featured = true

[[credits]]
name = "OpenMW"
role = "The virtual file system vfstool reimplements: data directory order, archives, and loose files over archives"
url = "https://openmw.org"

[[credits]]
name = "Benjamin Winger"
role = "Case-insensitive find"
url = "https://github.com/benjaminwinger"

# Every published version, oldest first. To release, add the next one here with the day you publish
# it, set the same version in vfstool/jess.toml, commit, and push its tag: git tag vfstool-2.0.1.

[[releases]]
version = "0.1.7"
date = 2025-06-17
summary = "First release on GitHub: find, extract and collapse OpenMW's virtual file system from the command line."
added = [
    "`find-file` prints where one VFS path comes from: the loose file, or the archive that holds it. `--simple` prints the bare path for pipes.",
    "`find --path` lists the files whose name, stem, extension, folder or path matches, in the mode `--type` picks, as JSON, YAML or TOML.",
    "`extract` copies one file out of the VFS, from a data directory or a BSA.",
    "`collapse` builds the whole VFS in one folder with hardlinks, with symbolic links (`--symbolic`), or with copies where linking fails (`--allow-copying`); `--extract-archives` unpacks BSA and BA2 contents too.",
    "`remaining` shows what a data directory still provides, or with `--replacements-only`, what overrides it.",
    "`--config` names the folder that holds `openmw.cfg`; `OPENMW_CONFIG` names a cfg file of any name.",
]

