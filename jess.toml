manifest_version = 1

[package]
id = "org.dreamweave.vfstool"
version = "0.1.0"
jess_api = "1"
default_target = "vfstool"
include = ["src"]
tests = ["tests/run.luau"]

[dependencies]
"org.dreamweave.openmw-config" = "0.1"
"org.dreamweave.vfs" = "0.1"

[modules]
"@vfstool" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it.

[[layer]]
id = "vfstool.core"
requires = ["openmw-config.core", "vfs.core"]
exports = ["@vfstool"]

# The command line itself. It reads the configuration, data folders, archives, and lock files;
# writes reports, collapsed and extracted files, and `run`'s merged folder; reads OPENMW_CONFIG and
# NO_COLOR; and `run` starts the command it is given.
[targets.vfstool]
kind = "command"
command = "vfstool"
entry = "src/main.luau"
capabilities = ["filesystem.read", "filesystem.write", "process.environment", "process.spawn"]
