manifest_version = 1

[package]
id = "org.dreamweave.vfstool"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau"]

[dependencies]
"org.dreamweave.openmw-config" = "0.1"
"org.dreamweave.vfs" = "0.1"

[modules]
"@vfstool" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it.

[[layer]]
id = "vfstool.core"
requires = ["openmw-config.core", "vfs.core"]
exports = ["@vfstool"]
