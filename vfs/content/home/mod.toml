# DreamWeave VFS as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `vfs-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "2eb18c13-854d-4f1a-af65-ef40705e77f8"
slug = "vfs"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.vfs"

[[releases]]
version = "0.1.0"
date = 2026-10-19
summary = "First release published as a DreamWeave project."
