[package]
name = "vfstool_lib"
version = "0.9.1"
edition = "2024"
rust-version = "1.87"
description = "A library for constructing and manipulating virtual file systems in Rust, based on OpenMW's VFS implementation."
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/DreamWeave-MP/vfstool"
repository = "https://github.com/DreamWeave-MP/vfstool"
keywords = ["vfs", "openmw", "gamedev", "modding", "bethesda"]

[dependencies]
ahash = "0.8"
blake3 = "1"
dream-path = "0.2"
dream_archive = { version = "0.2", optional = true, default-features = false, features = ["ba2", "bsa", "parallel"] }
mlua = { version = "0.12.1", default-features = false, features = ["serialize"], optional = true }
zip = { version = "8.6", optional = true, default-features = false, features = ["deflate", "lzma"] }
rayon = "1.12.0"
regex = "1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
serde_yaml = { version = "0.9.34-deprecated", optional = true }
toml = { version = "1.1.2", optional = true }
walkdir = "2.5.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
default = []
beth-archives = ["dep:dream_archive"]
zip = ["dep:zip"]
serialize = ["dep:serde", "dep:serde_json", "dep:serde_yaml", "dep:toml"]
lua = ["dep:mlua", "mlua/serialize", "mlua/luau"]

[package.metadata.docs.rs]
features = ["beth-archives", "zip", "serialize", "lua"]

[[bench]]
name = "vfs_benchmarks"
harness = false
