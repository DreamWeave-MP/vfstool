name: Corprus Crucible Manufacturing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
    tags: ["*"]

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/rustGlobalBuild.yml@v53
    secrets: inherit
    with:
      binary_names: '["vfstool"]'
      # A bare version tag publishes vfstool_lib, then vfstool, to crates.io, dependencies first.
      cargo_publish_workspace: true
      generate_benchmarks: true
      dependent_repo_names: '["DreamWeave-MP/Morrobroom"]'
      # StroggForge records each release of the program in content/home/mod.lock and, once the
      # workspace is published, the library's version in content/lib/mod.lock, then deploys the
      # site in content/.
      mod_template: true
